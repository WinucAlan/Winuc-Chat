<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Winuc Chat</title>
  <style>
    :root {
      --bg-body: #f0f2f5; --bg-sidebar: #ffffff; --bg-chat: #e5e7eb;
      --bg-msg-self: #dcfce7; --bg-msg-other: #ffffff;
      --text-primary: #111827; --text-secondary: #6b7280;
      --border: #d1d5db; --accent: #2563eb; --accent-hover: #1d4ed8;
      --danger: #ef4444; --shadow: rgba(0,0,0,0.05);
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg-body: #0f172a; --bg-sidebar: #1e293b; --bg-chat: #0f172a;
      --bg-msg-self: #065f46; --bg-msg-other: #334155;
      --text-primary: #f1f5f9; --text-secondary: #cbd5e1;
      --border: #475569; --accent: #60a5fa; --accent-hover: #3b82f6;
      --danger: #fca5a5; --shadow: rgba(0,0,0,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: var(--bg-body); color: var(--text-primary); height: 100vh; overflow: hidden; }
    #app { height: 100vh; display: flex; flex-direction: column; color: var(--text-primary); background: var(--bg-body); }
    input, textarea, button { color: inherit; font-family: inherit; }
    ::placeholder { color: var(--text-secondary); opacity: 0.9; }

    .login-container { flex: 1; display: flex; align-items: center; justify-content: center; }
    .login-card { background: var(--bg-sidebar); padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px var(--shadow); width: 320px; display: flex; flex-direction: column; gap: 1rem; }
    .login-card h2 { text-align: center; }
    .login-card input { padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-body); color: var(--text-primary); }
    .login-card button { padding: 0.75rem; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; }
    .login-card a { text-align: center; color: var(--accent); cursor: pointer; font-size: 0.9rem; }
    .error { color: var(--danger); font-size: 0.85rem; text-align: center; min-height: 1.2em; }
    .ws-status { font-size: 0.75rem; text-align: center; padding: 0.5rem; color: var(--danger); }

    .main-container { flex: 1; display: flex; overflow: hidden; min-width: 0; }
    .sidebar { width: 280px; flex-shrink: 0; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; }
    .sidebar-header { padding: 1rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-weight: bold; gap: 0.5rem; }
    .sidebar-header span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sidebar-header > div { flex-shrink: 0; }
    .sidebar-header button { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-primary); margin-left: 0.5rem; }
    .chat-list { flex: 1; overflow-y: auto; overflow-x: hidden; }
    .chat-item { padding: 1rem; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; min-width: 0; }
    .chat-item:hover, .chat-item.active { background: var(--bg-body); }
    .chat-name { font-weight: 500; display: flex; align-items: center; gap: 0.5rem; min-width: 0; flex: 1; overflow: hidden; }
    .chat-name > .chat-name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .unread-dot { width: 8px; height: 8px; background: var(--danger); border-radius: 50%; flex-shrink: 0; }
    .chat-time { font-size: 0.75rem; color: var(--text-secondary); flex-shrink: 0; }
    .sidebar-footer { padding: 1rem; border-top: 1px solid var(--border); }
    .apply-btn { width: 100%; padding: 0.75rem; background: var(--bg-body); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; color: var(--text-primary); font-weight: 500; display: flex; justify-content: center; align-items: center; gap: 0.5rem; }
    .badge { background: var(--danger); color: white; font-size: 0.7rem; padding: 0.1rem 0.4rem; border-radius: 10px; }

    .chat-area { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg-chat); }
    .chat-header { padding: 1rem; background: var(--bg-sidebar); border-bottom: 1px solid var(--border); font-weight: bold; overflow: hidden; }
    .chat-header h3 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .messages { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 1.5rem; display: flex; flex-direction: column; min-width: 0; }
    .load-more-trigger { text-align: center; color: var(--text-secondary); font-size: 0.8rem; padding: 0.5rem; margin-bottom: 1rem; }

    .message { position: relative; display: flex; flex-direction: column; margin-bottom: 1rem; max-width: 70%; min-width: 0; }
    .message.self { align-self: flex-end; align-items: flex-end; }
    .message:not(.self) { align-self: flex-start; align-items: flex-start; }
    .msg-sender { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.25rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .msg-content { padding: 0.75rem 1rem; border-radius: 12px; background: var(--bg-msg-other); box-shadow: 0 1px 2px var(--shadow); word-break: break-word; overflow-wrap: anywhere; white-space: pre-wrap; max-width: 100%; min-width: 0; color: var(--text-primary); }
    .message.self .msg-content { background: var(--bg-msg-self); }
    .msg-content img { max-width: 240px; max-height: 320px; border-radius: 8px; display: block; }
    .msg-content a { color: var(--accent); text-decoration: none; word-break: break-all; }
    .msg-content .msg-recalled { color: var(--text-secondary); font-style: italic; font-size: 0.85rem; }
    .msg-content .msg-pending { opacity: 0.65; }
    .msg-time { font-size: 0.7rem; color: var(--text-secondary); margin-top: 0.25rem; }

    /* 消息操作按钮（引用 / 撤回） */
    .msg-actions { display: none; position: absolute; top: -12px; right: 0; gap: 4px; z-index: 2; }
    .message:hover .msg-actions { display: flex; }
    .msg-action-btn {
      padding: 2px 8px; font-size: 0.7rem; line-height: 1.4;
      color: var(--text-secondary); background: var(--bg-sidebar);
      border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
      white-space: nowrap;
    }
    .msg-action-btn:hover { color: var(--accent); border-color: var(--accent); }
    .msg-action-btn[data-action="recall"]:hover { color: var(--danger); border-color: var(--danger); }

    /* 消息内部引用块 */
    .msg-quote {
      display: block; cursor: pointer;
      padding: 4px 8px; margin: -2px 0 6px 0;
      border-left: 3px solid var(--accent);
      background: rgba(0,0,0,0.06);
      border-radius: 4px;
      font-size: 0.82rem;
      line-height: 1.35;
      max-width: 100%;
      overflow: hidden;
    }
    [data-theme="dark"] .msg-quote { background: rgba(255,255,255,0.08); }
    .msg-quote-name { color: var(--accent); font-weight: 500; font-size: 0.75rem; }
    .msg-quote-text {
      color: var(--text-secondary);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; word-break: break-word;
    }
    .msg-quote:hover { background: rgba(37, 99, 235, 0.12); }

    /* 输入区引用条 */
    .quote-bar {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--bg-sidebar);
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .quote-bar-content {
      flex: 1; min-width: 0;
      border-left: 3px solid var(--accent);
      padding-left: 0.6rem;
      line-height: 1.35;
    }
    .quote-bar-name { color: var(--accent); font-weight: 500; font-size: 0.78rem; display: block; }
    .quote-bar-text {
      color: var(--text-secondary); display: block;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .quote-bar-close {
      background: none; border: none; cursor: pointer;
      color: var(--text-secondary); font-size: 1.1rem;
      padding: 0 0.5rem; line-height: 1;
    }
    .quote-bar-close:hover { color: var(--danger); }

    .input-area { padding: 1rem; background: var(--bg-sidebar); border-top: 1px solid var(--border); display: flex; gap: 0.5rem; align-items: stretch; }
    .input-area textarea { flex: 1; resize: none; height: 60px; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-body); color: var(--text-primary); min-width: 0; }
    .input-area button { padding: 0 1.25rem; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; }
    .input-area button.icon-btn { background: var(--bg-body); color: var(--text-primary); border: 1px solid var(--border); padding: 0 0.9rem; font-size: 1.1rem; }
    .input-area button.icon-btn:hover { background: var(--border); }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal-content { background: var(--bg-sidebar); padding: 2rem; border-radius: 12px; width: 400px; max-width: 90vw; display: flex; flex-direction: column; gap: 1rem; }
    .add-friend { display: flex; gap: 0.5rem; }
    .add-friend input { flex: 1; padding: 0.5rem; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-body); color: var(--text-primary); min-width: 0; }
    .apply-item { padding: 0.75rem; background: var(--bg-body); border-radius: 8px; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
    .apply-item > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .apply-item button { padding: 0.4rem 0.8rem; border: none; border-radius: 6px; cursor: pointer; margin-left: 0.5rem; }
    .btn-accept { background: #10b981; color: white; }
    .btn-reject { background: var(--danger); color: white; }
    .btn-close { width: 100%; padding: 0.75rem; background: var(--border); color: var(--text-primary); border: none; border-radius: 8px; cursor: pointer; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div id="app" data-theme="light">
  <div id="view-login" class="login-container">
    <div class="login-card">
      <h2 id="login-title">欢迎回来</h2>
      <input id="input-username" placeholder="用户名" />
      <input id="input-password" type="password" placeholder="密码" />
      <div id="login-error" class="error"></div>
      <button id="btn-auth">登 录</button>
      <a id="link-switch">没有账号？去注册</a>
      <div id="ws-status-login" class="ws-status">正在连接服务器...</div>
    </div>
  </div>

  <div id="view-main" class="main-container hidden">
    <div class="sidebar">
      <div class="sidebar-header">
        <span id="current-user-display"></span>
        <div>
          <button id="btn-theme" title="切换主题">🌓</button>
          <button id="btn-logout" title="退出登录">🚪</button>
        </div>
      </div>
      <div id="chat-list" class="chat-list"></div>
      <div class="sidebar-footer">
        <button id="btn-show-apply" class="apply-btn">
          好友申请 <span id="apply-badge" class="badge hidden">0</span>
        </button>
      </div>
    </div>
    <div class="chat-area">
      <div class="chat-header"><h3 id="chat-title">主群</h3></div>
      <div id="messages" class="messages"></div>

      <!-- 引用预览条 -->
      <div id="quote-bar" class="quote-bar hidden">
        <div class="quote-bar-content">
          <span id="quote-bar-name" class="quote-bar-name"></span>
          <span id="quote-bar-text" class="quote-bar-text"></span>
        </div>
        <button id="quote-bar-close" class="quote-bar-close" title="取消引用">✕</button>
      </div>

      <div class="input-area">
        <button id="btn-attach" class="icon-btn" title="发送图片/文件">📎</button>
        <input type="file" id="file-input" hidden />
        <textarea id="input-msg" placeholder="输入消息... (Enter发送, Shift+Enter换行)"></textarea>
        <button id="btn-send">发送</button>
      </div>
    </div>
  </div>

  <div id="modal-apply" class="modal hidden">
    <div class="modal-content">
      <h3>好友申请</h3>
      <div class="add-friend">
        <input id="input-add-friend" placeholder="输入用户名添加好友" />
        <button id="btn-add-friend">添加</button>
      </div>
      <div id="apply-list"></div>
      <button id="btn-close-modal" class="btn-close">关闭</button>
    </div>
  </div>
</div>

<script>
  // ================= 1. 工具函数 =================
  function strToB64(str) {
    if (!str) return "";
    try {
      const bytes = new TextEncoder().encode(String(str));
      let bin = "";
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin);
    } catch (e) { return ""; }
  }
  function b64ToStr(str) {
    if (!str) return "";
    try {
      const clean = String(str).replace(/\s+/g, '');
      const bin = atob(clean);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    } catch (e) { return String(str); }
  }
  function looksLikeB64(s) {
    return typeof s === 'string' && s.length > 0 && s.length % 4 === 0
      && /^[A-Za-z0-9+/]+={0,2}$/.test(s);
  }
  function normStr(s) { return String(s == null ? '' : s).trim(); }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  function resolveUrl(url) {
    if (!url || typeof url !== 'string') return url || '';
    if (/^(data:|blob:|https?:|\/\/|\/)/i.test(url)) return url;
    if (looksLikeB64(url)) {
      const decoded = b64ToStr(url);
      if (decoded && decoded !== url && !/[\x00-\x08\x0B\x0C\x0E-\x1F]/.test(decoded)) return decoded;
    }
    return url;
  }
  function formatTime(ts) {
    if (!ts) return '';
    const d = new Date(Number(ts) * 1000);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
  }
  function isTempId(id) { return typeof id === 'string' && id.startsWith('temp_'); }
  function genTempId() { return 'temp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8); }

  // ============ 1.5 引用编解码（利用 msg_content 隐藏元数据） ============
  // 使用 U+2063 (INVISIBLE SEPARATOR) 作为包裹标记，肉眼不可见，不会与普通用户输入冲突
  const QUOTE_MARK = '\u2063';

  function encodeQuote(quote, text) {
    if (!quote) return text;
    const meta = {
      id: quote.msg_id,
      s: quote.senderName || '',
      c: (quote.content || '').slice(0, 120),
      t: quote.msg_type || 'text'
    };
    let payloadB64 = '';
    try { payloadB64 = strToB64(JSON.stringify(meta)); } catch (e) { return text; }
    return QUOTE_MARK + payloadB64 + QUOTE_MARK + text;
  }

  function parseQuote(text) {
    if (typeof text !== 'string' || text.length < 2 || text.charCodeAt(0) !== 0x2063) {
      return { quote: null, text: text };
    }
    const end = text.indexOf(QUOTE_MARK, 1);
    if (end === -1) return { quote: null, text: text };
    const b64 = text.slice(1, end);
    const rest = text.slice(end + 1);
    try {
      const meta = JSON.parse(b64ToStr(b64));
      if (!meta || typeof meta !== 'object' || meta.id == null) return { quote: null, text: text };
      return { quote: meta, text: rest };
    } catch (e) {
      return { quote: null, text: text };
    }
  }

  // ================= 2. 全局状态 =================
  const state = {
    isRegistering: false,
    currentUser: '', currentUserRaw: '',
    ws: null, wsConnected: false,
    eventCounter: 0, pendingRequests: {},
    friends: [], friendApplies: [],
    currentChatId: 'group_main', currentChatName: '主群',
    messages: [],
    hasMoreMessages: false,
    isLoadingMore: false,
    loadSeq: 0,
    quoteTarget: null   // { msg_id, senderName, content, msg_type }
  };
  const $ = id => document.getElementById(id);
  const app = $('app');

  // ================= 3. WebSocket =================
  function connectWs() {
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    state.ws = new WebSocket(`${protocol}//${location.host}/ws`);

    state.ws.onopen = () => {
      state.wsConnected = true;
      $('ws-status-login').innerText = '服务器已连接';
      $('ws-status-login').style.color = 'var(--text-secondary)';
    };
    state.ws.onerror = () => {};
    state.ws.onclose = () => {
      state.wsConnected = false;
      Object.keys(state.pendingRequests).forEach(k => {
        try { state.pendingRequests[k].reject(new Error('WS Closed')); } catch (e) {}
        delete state.pendingRequests[k];
      });
      if (state.currentUser) {
        alert("连接断开，请刷新页面重新登录。");
        location.reload();
      } else {
        $('ws-status-login').innerText = '连接失败，请检查服务端';
        $('ws-status-login').style.color = 'var(--danger)';
      }
    };
    state.ws.onmessage = (e) => {
      let data;
      try { data = JSON.parse(e.data); } catch (err) { return; }
      const evt = data.event;
      if (evt !== undefined && evt !== null && evt !== -1 && evt !== '-1') {
        const pending = state.pendingRequests[evt];
        if (pending) {
          delete state.pendingRequests[evt];
          pending.resolve(data);
          return;
        }
      }
      handlePush(data);
    };
  }

  function sendRequest(type, data = {}) {
    return new Promise((resolve, reject) => {
      if (!state.wsConnected) { reject(new Error('WS Disconnected')); return; }
      const event = ++state.eventCounter;
      state.pendingRequests[event] = { resolve, reject };
      setTimeout(() => {
        if (state.pendingRequests[event]) {
          state.pendingRequests[event].reject(new Error('Timeout'));
          delete state.pendingRequests[event];
        }
      }, 8000);
      try { state.ws.send(JSON.stringify({ type, event, ...data })); }
      catch (err) { delete state.pendingRequests[event]; reject(err); }
    });
  }

  function isCurrentChat(chatId) { return normStr(chatId) === normStr(state.currentChatId); }

  function sortMessages() {
    state.messages.sort((a, b) => {
      const ta = Number(a.msg_time) || 0, tb = Number(b.msg_time) || 0;
      if (ta !== tb) return ta - tb;
      if (a.__temp && !b.__temp) return 1;
      if (!a.__temp && b.__temp) return -1;
      const na = Number(a.msg_id), nb = Number(b.msg_id);
      if (Number.isFinite(na) && Number.isFinite(nb)) return na - nb;
      return 0;
    });
  }

  async function handlePush(data) {
    if (!data || !data.type) return;

    if (data.type === 'new_message') {
      const pushChatId = data.chat_id;
      const pushMsgId = Number(data.msg_id);
      if (!Number.isFinite(pushMsgId)) return;

      if (isCurrentChat(pushChatId)) {
        const seq = state.loadSeq;
        const chatIdSnapshot = state.currentChatId;
        try {
          const res = await sendRequest('get_history', {
            chat_id: chatIdSnapshot, from: pushMsgId, to: pushMsgId
          });
          if (seq !== state.loadSeq || !isCurrentChat(chatIdSnapshot)) return;

          const fetched = (res.messages || []).find(m => Number(m.msg_id) === pushMsgId);
          if (!fetched) return;

          let localIndex = state.messages.findIndex(m => Number(m.msg_id) === pushMsgId);

          if (localIndex === -1 && normStr(fetched.msg_sender) === normStr(state.currentUserRaw)) {
            const tempIndex = state.messages.findIndex(m =>
              m.__temp &&
              normStr(m.msg_sender) === normStr(fetched.msg_sender) &&
              m.msg_type === fetched.msg_type &&
              (m.content || '') === (fetched.content || '') &&
              (m.url || '') === (fetched.url || '')
            );
            if (tempIndex !== -1) {
              state.messages[tempIndex] = fetched;
              localIndex = tempIndex;
            }
          }

          if (localIndex === -1) {
            state.messages.push(fetched);
            sortMessages();
            renderMessages(true);
          } else {
            state.messages[localIndex] = fetched;
            renderMessages();
          }
        } catch (e) {}
      } else {
        const f = state.friends.find(f => normStr(f.chat_id) === normStr(pushChatId));
        if (f) { f.is_new = 1; renderSidebar(); }
      }
    } else if (data.type === 'new_apply') {
      refreshApplies();
    } else if (data.type === 'accepted_apply' || data.type === 'rejected_apply') {
      refreshFriends();
    }
  }

  // ================= 4. 渲染 =================
  function renderSidebar() {
    let html = `<div class="chat-item ${state.currentChatId === 'group_main' ? 'active' : ''}" data-id="group_main" data-name="主群">
                  <div class="chat-name"><span class="chat-name-text">🌐 主群</span></div>
                </div>`;
    state.friends.forEach(f => {
      html += `<div class="chat-item ${normStr(state.currentChatId) === normStr(f.chat_id) ? 'active' : ''}"
                    data-id="${escapeHtml(f.chat_id)}" data-name="${escapeHtml(f.display_name)}">
                 <div class="chat-name">
                   <span class="chat-name-text">${escapeHtml(f.display_name)}</span>
                   ${f.is_new == 1 ? '<span class="unread-dot"></span>' : ''}
                 </div>
                 <div class="chat-time">${escapeHtml(formatTime(f.last_time))}</div>
               </div>`;
    });
    $('chat-list').innerHTML = html;
    const badge = $('apply-badge');
    if (state.friendApplies.length > 0) {
      badge.innerText = state.friendApplies.length;
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }
  }

  function isNearBottom(container, threshold = 80) {
    return container.scrollHeight - container.scrollTop - container.clientHeight <= threshold;
  }

  function renderMessages(scrollToBottom = false, force = false) {
    const container = $('messages');
    const wasNearBottom = isNearBottom(container);

    let html = '';
    if (state.hasMoreMessages) {
      html += `<div class="load-more-trigger">${state.isLoadingMore ? '加载中...' : '向上滚动加载历史消息'}</div>`;
    } else if (state.messages.length > 0) {
      html += `<div class="load-more-trigger">没有更多消息了</div>`;
    }
    if (state.messages.length === 0 && !state.isLoadingMore) {
      html += '<div class="load-more-trigger">暂无消息</div>';
    }

    state.messages.forEach(msg => {
      const senderDisplay = b64ToStr(msg.msg_sender) || msg.msg_sender || '';
      const isSelf = normStr(msg.msg_sender) === normStr(state.currentUserRaw);
      const isRecalled = msg.msg_type === 'recall';
      const isPending = msg.__temp === true;

      let content = '';
      if (isRecalled) {
        content = `<span class="msg-recalled">消息已撤回</span>`;
      } else if (msg.msg_type === 'text') {
        const decodedText = b64ToStr(msg.content);
        const parsed = parseQuote(decodedText);
        if (parsed.quote) {
          const qName = escapeHtml(parsed.quote.s || '');
          let qText = parsed.quote.c || '';
          if (parsed.quote.t === 'image' && !qText) qText = '[图片]';
          if (parsed.quote.t === 'file' && !qText) qText = '[文件]';
          if (parsed.quote.t === 'recall') qText = '消息已撤回';
          const qPreview = escapeHtml(qText);
          content =
            `<div class="msg-quote" data-quote-msg-id="${escapeHtml(String(parsed.quote.id))}">` +
              `<div class="msg-quote-name">${qName}</div>` +
              `<div class="msg-quote-text">${qPreview}</div>` +
            `</div>` +
            escapeHtml(parsed.text);
        } else {
          content = escapeHtml(decodedText);
        }
      } else if (msg.msg_type === 'image') {
        const src = resolveUrl(msg.url);
        content = `<img src="${escapeHtml(src)}" alt="image" loading="lazy" />`;
      } else if (msg.msg_type === 'file') {
        const href = resolveUrl(msg.url);
        content = `<a href="${escapeHtml(href)}" target="_blank" rel="noopener" download>📎 下载文件</a>`;
      } else {
        content = `<span style="color:var(--text-secondary)">[不支持的消息类型: ${escapeHtml(msg.msg_type)}]</span>`;
      }

      const canRecall = isSelf && !isRecalled && !isPending;
      const canQuote = !isRecalled && !isPending;
      const msgIdStr = escapeHtml(String(msg.msg_id));

      let actionsHtml = '';
      if (canQuote || canRecall) {
        actionsHtml = `<div class="msg-actions">`;
        if (canQuote) {
          actionsHtml += `<button class="msg-action-btn" data-action="quote" data-msg-id="${msgIdStr}">💬 引用</button>`;
        }
        if (canRecall) {
          actionsHtml += `<button class="msg-action-btn" data-action="recall" data-msg-id="${msgIdStr}">↩ 撤回</button>`;
        }
        actionsHtml += `</div>`;
      }

      html += `<div class="message ${isSelf ? 'self' : ''}" data-msg-id="${msgIdStr}">
                 ${!isSelf ? `<div class="msg-sender">${escapeHtml(senderDisplay)}</div>` : ''}
                 ${actionsHtml}
                 <div class="msg-content ${isPending ? 'msg-pending' : ''}">${content}</div>
                 <div class="msg-time">${escapeHtml(formatTime(msg.msg_time))}</div>
               </div>`;
    });

    container.innerHTML = html;

    if (scrollToBottom && (force || wasNearBottom)) {
      container.scrollTop = container.scrollHeight;
    }
  }

  function renderApplies() {
    let html = state.friendApplies.length === 0
      ? '<div style="text-align:center;color:var(--text-secondary);">暂无新申请</div>' : '';
    state.friendApplies.forEach(apply => {
      html += `<div class="apply-item"><span>${escapeHtml(apply.display_name)}</span>
                 <div>
                   <button class="btn-accept" data-raw="${escapeHtml(apply.raw_name)}" data-action="accept">同意</button>
                   <button class="btn-reject" data-raw="${escapeHtml(apply.raw_name)}" data-action="reject">拒绝</button>
                 </div></div>`;
    });
    $('apply-list').innerHTML = html;
  }

  // ============ 4.5 引用相关渲染与交互 ============
  function renderQuoteBar() {
    const bar = $('quote-bar');
    if (!state.quoteTarget) {
      bar.classList.add('hidden');
      return;
    }
    $('quote-bar-name').innerText = state.quoteTarget.senderName || '';
    let preview = state.quoteTarget.content || '';
    if (state.quoteTarget.msg_type === 'image' && !preview) preview = '[图片]';
    if (state.quoteTarget.msg_type === 'file' && !preview) preview = '[文件]';
    $('quote-bar-text').innerText = preview;
    bar.classList.remove('hidden');
  }

  function clearQuote() {
    state.quoteTarget = null;
    renderQuoteBar();
  }

  function startQuote(msgIdStr) {
    const msg = state.messages.find(m => String(m.msg_id) === String(msgIdStr));
    if (!msg) return;
    if (msg.msg_type === 'recall') return;

    const senderName = b64ToStr(msg.msg_sender) || msg.msg_sender || '';
    let preview = '';
    if (msg.msg_type === 'text') {
      const decoded = b64ToStr(msg.content);
      const parsed = parseQuote(decoded);
      preview = parsed.text;
    } else if (msg.msg_type === 'image') {
      preview = '[图片]';
    } else if (msg.msg_type === 'file') {
      preview = '[文件]';
    }

    state.quoteTarget = {
      msg_id: msg.msg_id,
      senderName: senderName,
      content: (preview || '').slice(0, 120),
      msg_type: msg.msg_type
    };
    renderQuoteBar();
    const ta = $('input-msg');
    ta.focus();
    // 光标放到末尾
    const len = ta.value.length;
    try { ta.setSelectionRange(len, len); } catch (e) {}
  }

  function scrollToMessage(msgIdStr) {
    const target = document.querySelector(`.message[data-msg-id="${msgIdStr}"]`);
    if (!target) return;
    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    const prevBg = target.style.background;
    target.style.transition = 'background 0.5s';
    target.style.background = 'rgba(37, 99, 235, 0.25)';
    setTimeout(() => {
      target.style.background = prevBg;
      setTimeout(() => { target.style.transition = ''; }, 500);
    }, 800);
  }

  // ================= 5. 分页加载 =================
  async function loadMessages(chatId) {
    const seq = ++state.loadSeq;
    state.currentChatId = chatId;
    state.messages = [];
    state.hasMoreMessages = false;
    state.isLoadingMore = false;
    clearQuote(); // 切换会话时清掉引用状态
    $('messages').innerHTML = '<div class="load-more-trigger">加载中...</div>';

    try {
      const countRes = await sendRequest('get_message_count', { chat_id: chatId });
      if (seq !== state.loadSeq) return;
      if (countRes && countRes.success === false) {
        $('messages').innerHTML = `<div class="load-more-trigger" style="color:var(--danger)">${escapeHtml(countRes.error || '加载失败')}</div>`;
        return;
      }
      const totalCount = Number(countRes.count) || 0;
      if (totalCount === 0) { renderMessages(); return; }

      const to = totalCount;
      const from = Math.max(1, totalCount - 499);

      const historyRes = await sendRequest('get_history', { chat_id: chatId, from, to });
      if (seq !== state.loadSeq) return;

      const msgs = (historyRes.messages || []).slice();
      msgs.sort((a, b) => Number(a.msg_id) - Number(b.msg_id));
      state.messages = msgs;
      state.hasMoreMessages = (from > 1);

      renderMessages(true, true);
    } catch (e) {
      if (seq !== state.loadSeq) return;
      $('messages').innerHTML = `<div class="load-more-trigger" style="color:var(--danger)">加载失败</div>`;
    }
  }

  async function loadMoreMessages() {
    if (state.isLoadingMore || !state.hasMoreMessages || state.messages.length === 0) return;
    const seq = state.loadSeq;
    const chatId = state.currentChatId;

    state.isLoadingMore = true;
    renderMessages();

    try {
      const minMsgId = Number(state.messages[0].msg_id);
      if (!Number.isFinite(minMsgId) || minMsgId <= 1) {
        state.hasMoreMessages = false; state.isLoadingMore = false; renderMessages(); return;
      }
      const to = minMsgId - 1;
      const from = Math.max(1, to - 499);

      const container = $('messages');
      const oldScrollHeight = container.scrollHeight;
      const oldScrollTop = container.scrollTop;

      const historyRes = await sendRequest('get_history', { chat_id: chatId, from, to });
      if (seq !== state.loadSeq) return;

      const newMsgs = (historyRes.messages || []).slice();
      newMsgs.sort((a, b) => Number(a.msg_id) - Number(b.msg_id));

      const existing = new Set(state.messages.map(m => String(m.msg_id)));
      const merged = newMsgs.filter(m => !existing.has(String(m.msg_id)));

      state.messages = merged.concat(state.messages);
      state.hasMoreMessages = (from > 1);
      state.isLoadingMore = false;
      renderMessages();

      const newScrollHeight = container.scrollHeight;
      container.scrollTop = oldScrollTop + (newScrollHeight - oldScrollHeight);
    } catch (e) {
      if (seq === state.loadSeq) { state.isLoadingMore = false; renderMessages(); }
    }
  }

  // ================= 6. 业务逻辑 =================
  async function doAuth() {
    const u = $('input-username').value, p = $('input-password').value;
    if (!u || !p) { $('login-error').innerText = '请输入账号密码'; return; }
    $('login-error').innerText = '正在认证...';
    try {
      const type = state.isRegistering ? 'register' : 'login';
      const res = await sendRequest(type, { username: strToB64(u), password: strToB64(p) });
      if (res.success) {
        state.currentUser = u;
        state.currentUserRaw = strToB64(u);
        $('login-error').innerText = '';
        $('view-login').classList.add('hidden');
        $('view-main').classList.remove('hidden');
        $('current-user-display').innerText = state.currentUser;
        bindScrollEvent();
        await refreshFriends();
        await refreshApplies();
        await loadMessages('group_main');
      } else {
        $('login-error').innerText = res.error || '认证失败';
      }
    } catch (e) { $('login-error').innerText = '网络错误'; }
  }

  async function refreshFriends() {
    try {
      const res = await sendRequest('get_friend_list');
      if (res && Array.isArray(res.list)) {
        state.friends = res.list.map(f => ({
          raw_name: f.friend_name,
          display_name: b64ToStr(f.friend_name) || f.friend_name || '',
          chat_id: `private_${f.friend_name}`,
          is_new: f.is_new,
          last_time: f.last_time
        }));
      } else state.friends = [];
      renderSidebar();
    } catch (e) {}
  }

  async function refreshApplies() {
    try {
      const res = await sendRequest('get_friend_apply');
      if (res && Array.isArray(res.list)) {
        state.friendApplies = res.list.map(rawName => ({
          raw_name: rawName,
          display_name: b64ToStr(rawName) || rawName || ''
        }));
      } else state.friendApplies = [];
      renderSidebar(); renderApplies();
    } catch (e) {}
  }

  async function sendContent({ msg_type, msg_content, url, previewText }) {
    const chatId = state.currentChatId;
    if (normStr(chatId) !== normStr(state.currentChatId)) return;

    const tempId = genTempId();
    const tempMsg = {
      msg_id: tempId,
      msg_type,
      msg_sender: state.currentUserRaw,
      msg_time: Math.floor(Date.now() / 1000),
      __temp: true
    };
    if (msg_type === 'text') tempMsg.content = msg_content;
    if (msg_type === 'image' || msg_type === 'file') tempMsg.url = url;

    state.messages.push(tempMsg);
    renderMessages(true);

    const payload = { chat_id: chatId, msg_type };
    if (msg_type === 'text') payload.msg_content = msg_content;
    else payload.url = url;

    try {
      const res = await sendRequest('send', payload);
      if (res && res.success === false) {
        removeTemp(tempId);
        alert(res.error || '发送失败');
        if (msg_type === 'text' && previewText != null) $('input-msg').value = previewText;
        return false;
      }
      if (res && res.msg_id != null && Number.isFinite(Number(res.msg_id))) {
        const idx = state.messages.findIndex(m => m.msg_id === tempId);
        if (idx !== -1) {
          state.messages[idx] = { ...state.messages[idx], msg_id: Number(res.msg_id), __temp: false };
          renderMessages();
        }
      }
      return true;
    } catch (e) {
      removeTemp(tempId);
      alert('发送失败：网络错误');
      if (msg_type === 'text' && previewText != null) $('input-msg').value = previewText;
      return false;
    }
  }

  function removeTemp(tempId) {
    const idx = state.messages.findIndex(m => m.msg_id === tempId);
    if (idx !== -1) { state.messages.splice(idx, 1); renderMessages(); }
  }

  async function sendMessage() {
    const text = $('input-msg').value;
    if (!text || !text.trim()) return;

    // 如果存在引用，把引用元数据“隐形”包裹在内容最前面
    const payloadText = state.quoteTarget
      ? encodeQuote(state.quoteTarget, text)
      : text;

    const ok = await sendContent({
      msg_type: 'text',
      msg_content: strToB64(payloadText),
      previewText: text   // 失败恢复时使用原始文本
    });

    if (ok) {
      $('input-msg').value = '';
      clearQuote();
    }
  }

  async function sendFile(file) {
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { alert('文件过大，最大 5MB'); return; }
    const isImage = /^image\//.test(file.type);
    const msg_type = isImage ? 'image' : 'file';
    const reader = new FileReader();
    reader.onload = async () => {
      const dataUrl = String(reader.result || '');
      await sendContent({ msg_type, url: dataUrl });
    };
    reader.onerror = () => alert('读取文件失败');
    reader.readAsDataURL(file);
  }

  async function recallMessage(chatId, msgId) {
    const numericMsgId = Number(msgId);
    if (!Number.isFinite(numericMsgId)) { alert('消息ID无效'); return; }
    if (!confirm('确定撤回这条消息吗？')) return;
    if (normStr(chatId) !== normStr(state.currentChatId)) return;

    const idx = state.messages.findIndex(m => Number(m.msg_id) === numericMsgId);
    if (idx === -1) return;
    const original = state.messages[idx];

    state.messages[idx] = { ...original, msg_type: 'recall', content: '', url: undefined, __temp: false };
    renderMessages();

    // 如果正在引用的就是这条消息，取消引用状态
    if (state.quoteTarget && String(state.quoteTarget.msg_id) === String(numericMsgId)) {
      clearQuote();
    }

    try {
      const res = await sendRequest('recall', { chat_id: chatId, msg_id: numericMsgId });
      if (res && res.success === false) {
        if (normStr(chatId) === normStr(state.currentChatId)) {
          state.messages[idx] = original; renderMessages();
        }
        alert(res.error || '撤回失败');
      }
    } catch (e) {
      if (normStr(chatId) === normStr(state.currentChatId)) {
        state.messages[idx] = original; renderMessages();
      }
      alert('撤回失败：网络错误');
    }
  }

  // ================= 7. 事件绑定 =================
  function bindScrollEvent() {
    const container = $('messages');
    container.onscroll = () => { if (container.scrollTop <= 50) loadMoreMessages(); };
  }

  $('btn-auth').onclick = doAuth;
  $('link-switch').onclick = () => {
    state.isRegistering = !state.isRegistering;
    $('login-title').innerText = state.isRegistering ? '注册新账号' : '欢迎回来';
    $('btn-auth').innerText = state.isRegistering ? '注 册' : '登 录';
  };
  $('input-password').onkeydown = (e) => { if (e.key === 'Enter') doAuth(); };
  $('btn-theme').onclick = () => {
    const next = app.dataset.theme === 'light' ? 'dark' : 'light';
    app.dataset.theme = next;
    localStorage.setItem('chat_theme', next);
  };
  $('btn-logout').onclick = () => location.reload();

  $('chat-list').onclick = (e) => {
    const item = e.target.closest('.chat-item');
    if (!item) return;
    const id = item.dataset.id;
    const name = item.dataset.name;
    $('chat-title').innerText = name;
    const f = state.friends.find(f => normStr(f.chat_id) === normStr(id));
    if (f) f.is_new = 0;
    loadMessages(id);
    renderSidebar();
    sendRequest('readed', { chat_id: id }).catch(() => {});
  };

  $('btn-send').onclick = sendMessage;
  $('input-msg').onkeydown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    // 输入框清空且按退格时，如果内容为空则取消引用（常见 IM 交互）
    if (e.key === 'Backspace' && !e.shiftKey) {
      setTimeout(() => {
        if ($('input-msg').value === '' && state.quoteTarget) clearQuote();
      }, 0);
    }
  };

  $('btn-attach').onclick = () => $('file-input').click();
  $('file-input').onchange = (e) => {
    const file = e.target.files[0];
    if (file) sendFile(file);
    e.target.value = '';
  };

  // 消息区域点击：撤回 / 引用 / 点击引用块跳转
  $('messages').addEventListener('click', (e) => {
    // 1. 点击消息内部的引用块 -> 定位到原消息
    const quoteEl = e.target.closest('.msg-quote[data-quote-msg-id]');
    if (quoteEl) {
      e.stopPropagation();
      const qid = quoteEl.dataset.quoteMsgId;
      if (qid) scrollToMessage(qid);
      return;
    }

    // 2. 点击操作按钮
    const btn = e.target.closest('.msg-action-btn');
    if (!btn) return;
    e.stopPropagation();
    const action = btn.dataset.action;
    const msgIdStr = btn.dataset.msgId;
    if (action === 'recall') {
      const msgId = Number(msgIdStr);
      if (!Number.isFinite(msgId)) return;
      recallMessage(state.currentChatId, msgId);
    } else if (action === 'quote') {
      startQuote(msgIdStr);
    }
  });

  // 引用条关闭按钮
  $('quote-bar-close').onclick = () => clearQuote();

  $('btn-show-apply').onclick = () => {
    $('modal-apply').classList.remove('hidden');
    refreshApplies();
  };
  $('btn-close-modal').onclick = () => $('modal-apply').classList.add('hidden');

  $('btn-add-friend').onclick = async () => {
    const target = $('input-add-friend').value.trim();
    if (!target) return;
    try {
      const res = await sendRequest('add_friend', { target: strToB64(target) });
      alert(res.success ? '请求已发送' : (res.error || '失败'));
      if (res.success) $('input-add-friend').value = '';
    } catch (e) { alert('请求失败'); }
  };

  $('apply-list').onclick = async (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const rawName = btn.dataset.raw;
    const action = btn.dataset.action;
    const type = action === 'accept' ? 'accept_friend' : 'reject_friend';
    try {
      await sendRequest(type, { target: rawName });
      refreshApplies();
      if (action === 'accept') refreshFriends();
    } catch (err) {}
  };

  // ================= 8. 初始化 =================
  app.dataset.theme = localStorage.getItem('chat_theme')
    || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  connectWs();
</script>
</body>
</html>
